<html>

<head>
  <meta charset="utf-8">
  <title>Tips</title>
  <style>
    * {
      margin: 0;
      padding: 0
    }

    body {
      font-family: 微软雅黑;
      font-size: 12px;
      padding: 10px;
    }

    body.white {
      background: #fff;
      color: #000
    }

    body.black {
      background: #000;
      color: #fff
    }

    a {
      color: #7C8A8A;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <table width="100%" height="100%" align="center" valign="center">
    <tr>
      <td width="100%" height="100%" align="center" valign="center">

        <div id="app">
          <div>更多资讯信息,需要Level2权限</div>
          <div style="margin-top:4px;">
            <a href="http://www.treeid/https://vip.tdx.com.cn/">点击了解</a>
          </div>
        </div>

      </td>
    </tr>
  </table>
  <script>
    function getUrlParam(o) {
      var l = new RegExp("(^|&)" + o + "=([^&]*)(&|$)");
      var e = window.location.search.substr(1).match(l);
      return null != e ? decodeURIComponent(e[2]) : null;
    }

    function getColor(o) {
      return /^([0-9a-z]{3}|[0-9a-z]{6})$/i.test(o) ? "#" + o : /^rgb\(\d+\,\d+\,\d+\)$/i.test(o) ? o : null
    }

    var fontSize = getUrlParam("fontsize");
    var bgColor = getUrlParam("color");
    var bgColor2 = getUrlParam('bkcolor')
    var fontColor = getColor(bgColor == 1 ? '000000' : 'ffffff');
    var text = getUrlParam("text");
    var elApp = document.getElementById("app");
    var elBody = document.body;
    if (1 == bgColor) {
      elBody.className = "white";
    }
    if (0 == bgColor || null == bgColor) {
      elBody.className = "black";
    }
    if (null != bgColor2) {
      elBody.style.backgroundColor = bgColor2;
    }
    if (/^\d+$/.test(fontSize)) {
      elApp.style.fontSize = fontSize + "px";
    }
    if (null != fontColor) {
      elApp.style.color = fontColor;
    }
    if (null != text) {
      elApp.innerHTML = text;
    }
    document.oncontextmenu = function () { return !1 };
  </script>
</body>

</html>
