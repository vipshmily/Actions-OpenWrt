    <script>
        function getParam() {
            var htmlParam =decodeURI(location.search.substring(1));
            var htmlArray = htmlParam.split("&");
            var objData = {};

            for (var row=0; row<htmlArray.length; row++)
            {
                var a = htmlArray[row].split("=");

                if (a.length >1)
                {
                    objData[a[0]] = a[1]
                }
            }
            objData["color"] = (objData["color"] == undefined && "white") || (objData["color"] == "1" && "white") || (objData["color"] == "0" && "black") || objData["color"]; // 经过同意处理
            objData["color_old"] = objData["color"] == undefined?"white":objData["color"]; //原始的值，
            return objData;
        } 
        (function(){
            var obj = getParam();
            // console.log()
            
            if(obj["bkcolor"]!=undefined && obj["bkcolor"].indexOf("tdxbkcolor")==-1 && obj["color"] == "black"){
                document.body.style.backgroundColor = "#"+obj["bkcolor"];  	
            }
            document.getElementsByTagName('html')[0].className = obj.color
            if (obj["linecolor"]){
                // 写入:root的css变量
                document.documentElement.style.setProperty('--primary-border-color', "#"+obj["linecolor"]);
            }            

        })() 
    </script>
